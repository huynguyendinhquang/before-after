# Install as /etc/nginx/conf.d/before-after.conf after replacing the LAN
# hostname and certificate paths.  The app is never served directly by nginx.
upstream before_after_gunicorn {
    server unix:/run/before-after/gunicorn.sock fail_timeout=0;
}

# Reject every host except the explicit clinic hostname.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_certificate     /etc/before-after/tls/clinic-lan-fullchain.pem;
    ssl_certificate_key /etc/before-after/tls/clinic-lan-key.pem;
    return 444;
}

server {
    listen 80;
    server_name before-after.clinic.lan;
    return 301 https://before-after.clinic.lan$request_uri;
}

server {
    listen 443 ssl http2;
    server_name before-after.clinic.lan;

    ssl_certificate     /etc/before-after/tls/clinic-lan-fullchain.pem;
    ssl_certificate_key /etc/before-after/tls/clinic-lan-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:before_after_tls:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 51m;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://before_after_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $server_name;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_set_header X-Forwarded-Prefix "";
        proxy_redirect off;
    }
}
